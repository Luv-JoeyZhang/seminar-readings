<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>前期ゼミナールI｜論文インタラクティブ読解</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #1a3a5c;
    --accent: #f5a623;
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1e2a38;
    --muted: #6b7a8d;
    --border: #dde3ec;
  }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }
  .hero {
    background: linear-gradient(135deg, var(--primary) 0%, #2d6a9f 100%);
    border-radius: 12px;
    padding: clamp(28px, 5vw, 48px) clamp(24px, 4vw, 40px);
    color: #fff;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    right: -50px; top: -50px;
    width: 240px; height: 240px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  .hero h1 {
    font-size: clamp(20px, 3.5vw, 30px);
    font-weight: 800;
    margin-bottom: 8px;
  }
  .hero p {
    font-size: clamp(13px, 1.8vw, 15px);
    opacity: 0.8;
  }
  .section-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 14px;
  }
  .paper-card {
    background: var(--card);
    border-radius: 10px;
    box-shadow: 0 2px 16px rgba(26,58,92,0.10);
    padding: 24px 28px;
    margin-bottom: 16px;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: box-shadow 0.2s, transform 0.15s;
    border-left: 4px solid var(--accent);
  }
  .paper-card:hover {
    box-shadow: 0 6px 24px rgba(26,58,92,0.18);
    transform: translateY(-2px);
  }
  .paper-title {
    font-size: clamp(15px, 2vw, 17px);
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 6px;
  }
  .paper-authors {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .paper-desc {
    font-size: 13.5px;
    color: #3a4a5c;
    line-height: 1.6;
  }
  .tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    margin-right: 6px;
    margin-top: 8px;
  }
  .tag-blue { background: #e3edf8; color: var(--primary); }
  .tag-yellow { background: #fef6e4; color: #b07d0a; }
  .footer {
    text-align: center;
    margin-top: 48px;
    font-size: 12px;
    color: var(--muted);
  }
  .empty-hint {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 20px 0 0;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="container">
  <div class="hero">
    <h1>📚 前期ゼミナールI</h1>
    <p>論文インタラクティブ読解ページ一覧</p>
  </div>

  <div class="section-label">📖 論文リスト</div>

  <a class="paper-card" href="taylor-greve-2006.html">
    <div class="paper-title">スーパーマンかファンタスティック・フォーか？革新チームにおける知識の組み合わせと経験</div>
    <div class="paper-authors">Taylor, A. & Greve, H. R. (2006) — Academy of Management Journal, 49(4), 723–740</div>
    <div class="paper-desc">知識の多様性と協働経験がイノベーション成果の平均値と分散にどう影響するかを、コミック出版業界のデータで実証分析。</div>
    <span class="tag tag-blue">イノベーション</span>
    <span class="tag tag-blue">チーム</span>
    <span class="tag tag-yellow">探索と活用</span>
  </a>

  <div class="empty-hint">他の論文は順次追加予定です ✨</div>

  <div class="footer">一橋大学｜前期ゼミナールI</div>
</div>

</body>
</html>
